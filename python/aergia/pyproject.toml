[project]
name = "aergia"
version = "0.4.0"
description = ""
authors = [
  {name = "Nicola Coretti", email = "nico.coretti@gmail.com"},
]
readme = "README.md"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.12"
keywords = ['ai', 'openai', 'llm', 'tui', 'cli', 'repl']
repository = "https://github.com/Nicoretti/one-piece/python/aergia"


dependencies = [
    "openai>=1.63.2",
    "rich-argparse>=1.7.0",
    "pillow>=11.1.0",
    "pydantic>=2.10.6",
    "tomli>=2.2.1",
    "tomli-w>=1.2.0",
    "class-singledispatch>=1.2.3.post2",
    "jinja2>=3.1.5",
]

[dependency-groups]
dev = [
    "pytest-anyio>=0.0.0",
    "pytest>=8.3.4",
    "ruff>=0.9.6",
    "rust-just>=1.39.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
aergia = "aergia.application:main"
ae = "aergia.application:main"

[tool.pytest.ini_options]
markers = [
    "openai_api:  tests utilizing the openai api.",
]
