[tool.poetry]
name = "konfy"
version = "0.1.0"
description = "Configure gui, tui, repl and cli applications"
packages = [
    { include = "konfy", from = "src" },
]
authors = ["Nicola Coretti <nico.coretti@gmail.com>"]
maintainers = ["Nicola Coretti <nico.coretti@gmail.com>"]
license = "MIT"
readme = "README.md"
classifiers = [
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
keywords = ['config', 'env', 'config-files', 'gui', 'tui', 'repl', 'cli']
repository = "https://github.com/Nicoretti/one-piece/tree/grand-line/python/konfy"

[tool.poetry.dependencies]
python = "^3.9"

[tool.poetry.group.dev.dependencies]
ruff = "^0.5.0"
pytest = "^8.2.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
