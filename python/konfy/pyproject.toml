[project]
name = "konfy"
version = "0.1.0"
description = "Configure gui, tui, repl and cli applications"
authors = [{ name = "Nicola Coretti", email = "nico.coretti@gmail.com" }]
requires-python = "~=3.9"
readme = "README.md"
license = "MIT"
maintainers = [{ name = "Nicola Coretti", email = "nico.coretti@gmail.com" }]
keywords = [
    "config",
    "env",
    "config-files",
    "gui",
    "tui",
    "repl",
    "cli",
]
classifiers = [
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Repository = "https://github.com/Nicoretti/one-piece/tree/grand-line/python/konfy"

[dependency-groups]
dev = [
    "ruff>=0.5.0,<0.6",
    "pytest>=8.2.2,<9",
    "rust-just>=1.40.0",
]

[tool.hatch.build.targets.sdist]
include = ["src/konfy"]

[tool.hatch.build.targets.wheel]
include = ["src/konfy"]

[tool.hatch.build.targets.wheel.sources]
"src/konfy" = "konfy"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
