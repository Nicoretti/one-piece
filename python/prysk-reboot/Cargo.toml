[package]
name = "prysk"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "prysk_core"
crate-type = ["rlib"]

[[bin]]
name = "prysk2ast"
path = "src/bin/prysk2ast.rs"

[[bin]]
name = "prysk2json"
path = "src/bin/prysk2json.rs"

[dependencies]
anyhow = "1.0.83"
clap = { version = "4.5.4", features = ["derive"] }
console = "0.15.8"
pest = { version = "2.7.8", features = ["pretty-print"] }
pest_derive = "2.7.8"
pyo3 = { version = "0.17.3", features = ["extension-module"] }
