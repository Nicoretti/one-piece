[project]
name = "ai-container"
version = "0.8.1"
description = "AI - Tool/Agent isolation"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click",
    "rich-click>=1.8.0",
    "podman>=5.8.0",
]

# Include the Containerfile in the package
[tool]
packages = ["ai_container"]

[project.scripts]
ai = "ai_container.cli:ai"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
