[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-container"
version = "0.1.0"
description = "AI - Tool/Agent isolation"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "rust-just>=1.46.0",
    "click",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.data]
"ai_container" = ["justfile"]

[project.scripts]
ai = "ai_container.cli:ai"